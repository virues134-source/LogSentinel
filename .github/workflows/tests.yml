name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Análisis de los logs de ejemplo
        run: node src/cli.ts analyze samples/auth.log samples/access.log --year 2026
      - name: Construcción de la demo web
        run: node scripts/build-site.ts
